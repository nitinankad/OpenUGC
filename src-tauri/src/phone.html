<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<title>Slides</title>
<style>
  :root {
    --paper: #ffffff; --ink: #14171a; --slate: #5d6670; --line: #e3e6ea; --mist: #f2f4f6;
    --accent: #0c8a62; --accent-ink: #ffffff; --ok: #0c8a62;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #111416; --ink: #eef1f3; --slate: #9aa4ad; --line: #2a3035; --mist: #1b2024; --accent: #2fbf8c; --accent-ink: #06231a; --ok: #2fbf8c; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    padding: max(20px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { margin: 0; font-size: 24px; line-height: 1.2; font-weight: 750; letter-spacing: -0.01em; }
  .sub { margin: 4px 0 18px; color: var(--slate); font-size: 15px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    min-height: 54px; padding: 0 18px; border: 0; border-radius: 14px;
    background: var(--accent); color: var(--accent-ink); font: inherit; font-size: 17px; font-weight: 700;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn-quiet { min-height: 44px; background: var(--mist); color: var(--ink); font-size: 15px; font-weight: 650; }
  .note { margin: 10px 2px 0; color: var(--slate); font-size: 14px; min-height: 1.45em; }
  .note.is-ok { color: var(--ok); font-weight: 650; }
  .note.is-err { color: #d4351c; }
  .strip {
    display: flex; gap: 8px; margin: 22px -16px 0; padding: 0 16px 6px;
    overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
  }
  .strip img {
    flex: 0 0 auto; width: 38%; max-width: 200px; aspect-ratio: 4 / 5; object-fit: cover;
    border-radius: 10px; background: var(--mist); scroll-snap-align: start;
  }
  .hint { margin: 6px 2px 0; color: var(--slate); font-size: 13px; }
  section { margin-top: 26px; }
  h2 { margin: 0 0 8px; font-size: 17px; font-weight: 700; }
  .text {
    margin: 0 0 10px; padding: 12px 14px; border-radius: 12px; background: var(--mist);
    white-space: pre-wrap; word-break: break-word; font-size: 15px;
    -webkit-user-select: text; user-select: text;
  }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1 id="name"></h1>
  <p class="sub" id="sub"></p>

  <button class="btn" id="save" disabled>Getting slides ready</button>
  <p class="note" id="note" role="status" aria-live="polite"></p>

  <div class="strip" id="strip"></div>
  <p class="hint" id="hint">You can also press and hold a slide to save it on its own.</p>

  <section id="caption-box" hidden>
    <h2>Caption and hashtags</h2>
    <p class="text" id="caption"></p>
    <button class="btn btn-quiet" id="copy-caption">Copy caption</button>
  </section>

  <section id="title-box" hidden>
    <h2>Title</h2>
    <p class="text" id="title"></p>
    <button class="btn btn-quiet" id="copy-title">Copy title</button>
  </section>
</main>

<script id="data" type="application/json">__DATA__</script>
<script>
(() => {
  const data = JSON.parse(document.getElementById("data").textContent);
  const $ = (id) => document.getElementById(id);
  const ua = navigator.userAgent;
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/i.test(ua);
  const n = data.slides.length;
  const plural = n === 1 ? "slide" : "slides";

  document.title = data.name || "Slides";
  $("name").textContent = data.name || "Your slides";
  $("sub").textContent = [data.account, `${n} ${plural}`].filter(Boolean).join(", ");

  const strip = $("strip");
  for (const [i, f] of data.slides.entries()) {
    const img = document.createElement("img");
    img.src = f;
    img.alt = `Slide ${i + 1}`;
    img.loading = i < 3 ? "eager" : "lazy";
    strip.appendChild(img);
  }

  const note = (text, kind) => {
    const el = $("note");
    el.textContent = text;
    el.className = "note" + (kind ? ` is-${kind}` : "");
  };

  const copy = async (text, btn, label) => {
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      // Older browsers: copy through a hidden text box.
      const t = document.createElement("textarea");
      t.value = text;
      t.setAttribute("readonly", "");
      t.style.position = "fixed";
      t.style.opacity = "0";
      document.body.appendChild(t);
      t.select();
      t.setSelectionRange(0, text.length);
      document.execCommand("copy");
      t.remove();
    }
    btn.textContent = "Copied";
    setTimeout(() => (btn.textContent = label), 1600);
  };
  if (data.caption) {
    $("caption-box").hidden = false;
    $("caption").textContent = data.caption;
    $("copy-caption").addEventListener("click", (e) => copy(data.caption, e.currentTarget, "Copy caption"));
  }
  if (data.title) {
    $("title-box").hidden = false;
    $("title").textContent = data.title;
    $("copy-title").addEventListener("click", (e) => copy(data.title, e.currentTarget, "Copy title"));
  }

  // Fetch every slide up front. iOS only opens the share sheet straight from a tap, so there's
  // no time to download anything once the button is pressed.
  const btn = $("save");
  let files = null;
  Promise.all(
    data.slides.map(async (f) => {
      const r = await fetch(f, { cache: "force-cache" });
      if (!r.ok) throw new Error(`${f} returned ${r.status}`);
      return new File([await r.blob()], f, { type: "image/jpeg" });
    }),
  ).then(
    (list) => {
      files = list;
      const canShare = isIOS && navigator.canShare && navigator.canShare({ files });
      btn.dataset.mode = canShare ? "share" : "download";
      btn.textContent = canShare ? `Save ${n} ${plural} to Photos` : `Download all ${n} ${plural}`;
      btn.disabled = false;
      if (canShare) note(`Then choose "Save ${n} Images".`);
      else if (isAndroid) note("They go to Downloads, in order, and show up in your gallery.");
    },
    (e) => {
      btn.textContent = "Couldn't load the slides";
      note(`Reload the page to try again. ${e.message || e}`, "err");
    },
  );

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  btn.addEventListener("click", async () => {
    if (!files) return;
    if (btn.dataset.mode === "share") {
      try {
        // Files only: adding text can hide "Save Images" from the share sheet.
        await navigator.share({ files });
        note("Saved. Open TikTok and pick them from your recents.", "ok");
      } catch (e) {
        if (e && e.name !== "AbortError") note(`Couldn't open the share sheet: ${e.message || e}`, "err");
      }
      return;
    }
    // One at a time, so they land in order (TikTok sorts by date added).
    btn.disabled = true;
    for (const [i, file] of files.entries()) {
      btn.textContent = `Downloading ${i + 1} of ${n}`;
      const url = URL.createObjectURL(file);
      const a = document.createElement("a");
      a.href = url;
      a.download = file.name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      await sleep(900);
    }
    btn.disabled = false;
    btn.textContent = `Download all ${n} ${plural} again`;
    note(isAndroid ? "Done. If only one saved, allow multiple downloads when Chrome asks, then tap again." : "Done.", "ok");
  });
})();
</script>
</body>
</html>
