[package]
name = "openugc"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "OpenUGC desktop app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tiny-skia = "0.12"
rustybuzz = "0.20"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Pixel loops (slide rendering) are painfully slow unoptimised.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
